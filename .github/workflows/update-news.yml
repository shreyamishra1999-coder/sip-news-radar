name: Update news radar
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - name: Fetch, contextual-filter, rank and deduplicate
        run: python scripts/fetch_news.py
      - name: Commit refreshed snapshot
        run: |
          git config user.name "news-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet || git commit -m "Auto-update intelligence snapshot"
          git push
