name: Update news radar
on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"
permissions:
  contents: write
concurrency:
  group: news-radar-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch, rank, summarize and archive
        run: python scripts/fetch_news.py
      - name: Commit refreshed data
        run: |
          git config user.name "news-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json data/history.json data/archive/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Auto-update intelligence data"
          git push origin HEAD:main
